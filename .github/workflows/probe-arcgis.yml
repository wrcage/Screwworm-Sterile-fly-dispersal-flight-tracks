name: Probe ArcGIS map

# Read-only: follows an ArcGIS Online app/web-map id to its feature layers and
# prints their URLs, fields and sample rows. Changes nothing in the repo.
on:
  workflow_dispatch:
    inputs:
      item_id:
        description: "ArcGIS item id (from ...?appid=XXXX or ...?webmap=XXXX)"
        type: string
        required: true
      host:
        description: "Portal host"
        type: string
        default: "www.arcgis.com"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python probe_arcgis.py "${{ inputs.item_id }}" "${{ inputs.host }}"
