name: Probe Tableau dashboard

# Read-only: finds a Tableau dashboard embedded in a page and tries its CSV
# export. Changes nothing in the repo.
on:
  workflow_dispatch:
    inputs:
      page:
        description: "Web page that embeds the dashboard"
        type: string
        required: true
      extra:
        description: "Optional Tableau view URL(s) to try, space-separated"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # URLs go through env vars: they contain '&', which the shell would
      # otherwise treat as "run in background".
      - env:
          PAGE: ${{ inputs.page }}
          EXTRA: ${{ inputs.extra }}
        run: python probe_tableau.py "$PAGE" $EXTRA
      - name: Inspect workbook sheets (tableauscraper)
        if: ${{ inputs.extra != '' }}
        env:
          EXTRA: ${{ inputs.extra }}
        run: |
          pip install -q tableauscraper
          for u in $EXTRA; do python probe_tableau2.py "$u" || true; done
      - name: Inspect via headless browser
        if: ${{ inputs.extra != '' }}
        env:
          EXTRA: ${{ inputs.extra }}
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null
          for u in $EXTRA; do python probe_tableau3.py "$u"; done
